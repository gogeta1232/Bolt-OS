name: Sync docs to bolt-docs

on:
  push:
    branches: [main]
    paths:
      - 'src/commands/**'
      - 'src/lib/fake-permissions.ts'
      - 'src/lib/access-overview.ts'
      - 'src/scripts/export-commands.ts'
      - 'site/src/content/**'
      - 'site/src/data/commands.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  export-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export commands.json
        run: npm run docs:export
      - name: Create Pull Request if changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(docs): refresh commands.json from source'
          title: 'chore(docs): refresh commands.json from source'
          body: 'Automated sync — `npm run docs:export` updated `site/src/data/commands.json`. This keeps `bolt-docs` in sync without manual copy.'
          branch: chore/sync-commands-json
          branch-suffix: timestamp
          add-paths: site/src/data/commands.json
          delete-branch: true
      - name: Dispatch to bolt-docs
        if: github.repository == 'gogeta1232/Bolt-OS'
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "DOCS_SYNC_TOKEN not set — skipping dispatch (bolt-docs will sync via scheduled fetch)"; exit 0; fi
          gh api repos/gogeta1232/bolt-docs/dispatches -f event_type=bolt-os-commands-updated || echo "dispatch failed — bolt-docs will sync via nightly fetch"
